<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxPyLang Web Engine — prototype</title>
    <style>
      :root {
        --bg: #16181c; --panel: #1d2027; --line: #2c313a;
        --ink: #d6dbe2; --dim: #8b93a0;
        --signal: #e8b73e; --control: #5aa9e6; --video: #a882e6; --go: #4bd08a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
      header {
        padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        position: sticky; top: 0; z-index: 5;
      }
      h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .2px; }
      button, select, label.file {
        background: #262b33; color: var(--ink); border: 1px solid #39404b; border-radius: 6px;
        padding: 6px 11px; font-size: 13px; cursor: pointer; transition: background .12s, border-color .12s;
      }
      button:hover:not(:disabled), select:hover, label.file:hover { background: #2f3540; border-color: #4a5361; }
      button:disabled { opacity: 0.4; cursor: default; }
      #start { border-color: var(--go); color: #cdf6e3; }
      #start:hover:not(:disabled) { background: #1f3d31; }
      #coverage {
        padding: 8px 16px; font-size: 12px; color: var(--dim); font-family: ui-monospace, monospace;
        border-bottom: 1px solid var(--line); background: #14161a;
      }
      #graph {
        padding: 20px; overflow: auto;
        background:
          radial-gradient(circle at 1px 1px, #23272f 1px, transparent 0) 0 0 / 22px 22px;
      }
      input[type=file] { display: none; }
      .hint { font-size: 11px; color: #6b7280; }

      /* ── graph nodes ── */
      .patch-graph { display: block; }
      .patch-graph .node-body { fill: #23272f; stroke: #3a414c; stroke-width: 1; }
      .patch-graph .node:hover .node-body { stroke: #566173; }
      .patch-graph .node-label {
        fill: var(--ink); font: 11px ui-monospace, "SF Mono", Menlo, monospace; dominant-baseline: middle;
      }
      .patch-graph .node-stub .node-body { fill: #24282f; stroke: #4a3a3a; stroke-dasharray: 4 3; }
      .patch-graph .node-stub .node-label { fill: #8a8f98; }
      .patch-graph .node-caption {
        fill: var(--dim); font: 10px ui-monospace, monospace;
      }

      /* ── widgets mounted in the graph ── */
      .widget-host { overflow: visible; }
      .max-widget { width: 100%; height: 100%; margin: 0; }
      input[type=range].max-widget {
        -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
      }
      input[type=range].max-widget::-webkit-slider-runnable-track {
        height: 6px; border-radius: 3px; background: #363d47;
      }
      input[type=range].max-widget::-moz-range-track { height: 6px; border-radius: 3px; background: #363d47; }
      input[type=range].max-widget::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5px;
        border-radius: 50%; background: var(--control); border: 2px solid #1a1d22; box-shadow: 0 1px 3px #0007;
      }
      input[type=range].max-widget::-moz-range-thumb {
        width: 16px; height: 16px; border-radius: 50%; background: var(--control); border: 2px solid #1a1d22;
      }
      input[type=range].max-dial { accent-color: var(--signal); }
      input[type=range].max-dial::-webkit-slider-thumb { background: var(--signal); }
      input[type=range].max-dial::-moz-range-thumb { background: var(--signal); }
      input[type=number].max-widget {
        background: #1a1d22; color: var(--ink); border: 1px solid #39404b; border-radius: 4px;
        font: 12px ui-monospace, monospace; padding: 2px 4px;
      }
      .max-incdec, .max-rslider, .max-kslider, .max-nslider { display: flex; gap: 2px; height: 100%; }
      .max-rslider { flex-direction: column; }
      .max-incdec { flex-direction: column; }
      .max-incdec button {
        flex: 1; padding: 0; font-size: 8px; line-height: 1; border-radius: 3px; min-width: 22px;
      }
      .max-kslider { gap: 1px; }
      .max-kslider .max-key {
        flex: 1; padding: 0; background: #eef1f4; border: 1px solid #333; border-radius: 0 0 3px 3px; min-width: 12px;
      }
      .max-kslider .max-key:nth-child(2), .max-kslider .max-key:nth-child(4),
      .max-kslider .max-key:nth-child(7), .max-kslider .max-key:nth-child(9),
      .max-kslider .max-key:nth-child(11) { background: #2a2e35; }
      .max-kslider .max-key:active { background: var(--control); }
    </style>
    <script type="module" crossorigin src="/MaxPyLang/app/assets/index-BCof4v54.js"></script>
  </head>
  <body>
    <header>
      <h1>MaxPyLang Web Engine</h1>
      <button id="start" disabled>▶ Start audio</button>
      <button id="stop" disabled>■ Stop</button>
      <button id="selftest">✓ Self-test</button>
      <select id="samples">
        <option value="">— sample patches —</option>
        <optgroup label="Basics">
          <option value="test-patches/hello_world.maxpat">hello_world — a 440 Hz tone</option>
        </optgroup>
        <optgroup label="Synths (press ▶)">
          <option value="test-patches/subtractive_synth.maxpat">subtractive_synth — LFO-swept filter</option>
          <option value="test-patches/fm_synth.maxpat">fm_synth — 2-op FM</option>
          <option value="test-patches/tremolo.maxpat">tremolo — 5 Hz amplitude LFO</option>
          <option value="test-patches/detuned_chord.maxpat">detuned_chord — beating oscillators</option>
        </optgroup>
        <optgroup label="Generative (press ▶)">
          <option value="test-patches/arpeggiator.maxpat">arpeggiator — metro / counter / mtof</option>
          <option value="test-patches/random_melody.maxpat">random_melody — metro / random</option>
        </optgroup>
        <optgroup label="Interactive (drag the widgets)">
          <option value="test-patches/interactive_synth.maxpat">interactive_synth — slider + dials</option>
        </optgroup>
        <optgroup label="Video">
          <option value="test-patches/webcam_pixelated_synth.maxpat">webcam_pixelated_synth — jit.grab</option>
        </optgroup>
      </select>
      <label class="file">Load .maxpat<input id="file" type="file" accept=".maxpat,.json" /></label>
      <span class="hint">or drag a .maxpat onto the page</span>
    </header>
    <div id="coverage">Loading…</div>
    <div id="graph"></div>
  </body>
</html>

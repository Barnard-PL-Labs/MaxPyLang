<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxPyLang Web Engine — prototype</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: #ddd; }
      header { padding: 12px 16px; border-bottom: 1px solid #333; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
      button, select, label.file { background: #2c2c2c; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #start { border-color: #4a7; }
      #coverage { padding: 8px 16px; font-size: 12px; color: #9a9; font-family: monospace; border-bottom: 1px solid #333; }
      #graph { padding: 16px; overflow: auto; }
      #graph svg line { stroke-linecap: round; }
      input[type=file] { display: none; }
      .hint { font-size: 11px; color: #777; }
    </style>
    <script type="module" crossorigin src="/MaxPyLang/app/assets/index-Dzdh7B9d.js"></script>
  </head>
  <body>
    <header>
      <h1>MaxPyLang Web Engine</h1>
      <button id="start" disabled>▶ Start audio</button>
      <button id="stop" disabled>■ Stop</button>
      <button id="selftest">✓ Self-test</button>
      <select id="samples">
        <option value="">— sample patches —</option>
        <optgroup label="Basics">
          <option value="test-patches/hello_world.maxpat">hello_world — a 440 Hz tone</option>
        </optgroup>
        <optgroup label="Synths (press ▶)">
          <option value="test-patches/subtractive_synth.maxpat">subtractive_synth — LFO-swept filter</option>
          <option value="test-patches/fm_synth.maxpat">fm_synth — 2-op FM</option>
          <option value="test-patches/tremolo.maxpat">tremolo — 5 Hz amplitude LFO</option>
          <option value="test-patches/detuned_chord.maxpat">detuned_chord — beating oscillators</option>
        </optgroup>
        <optgroup label="Generative (press ▶)">
          <option value="test-patches/arpeggiator.maxpat">arpeggiator — metro / counter / mtof</option>
          <option value="test-patches/random_melody.maxpat">random_melody — metro / random</option>
        </optgroup>
        <optgroup label="Interactive (drag the widgets)">
          <option value="test-patches/interactive_synth.maxpat">interactive_synth — slider + dials</option>
        </optgroup>
        <optgroup label="Video">
          <option value="test-patches/webcam_pixelated_synth.maxpat">webcam_pixelated_synth — jit.grab</option>
        </optgroup>
      </select>
      <label class="file">Load .maxpat<input id="file" type="file" accept=".maxpat,.json" /></label>
      <span class="hint">or drag a .maxpat onto the page</span>
    </header>
    <div id="coverage">Loading…</div>
    <div id="graph"></div>
  </body>
</html>

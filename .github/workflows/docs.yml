name: Build and Deploy Documentation

# On a pull request: build the site strictly and stop, so a broken page fails the PR.
# On main: build, then commit the site into docs/ for GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/source/**'
      - 'docs/examples/**'
      - 'docs/run_examples.py'
      - 'docs/requirements.txt'
      - 'docs/Makefile'
      - 'maxpylang/**'          # API pages are generated from the package's docstrings
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/source/**'
      - 'docs/examples/**'
      - 'docs/run_examples.py'
      - 'docs/requirements.txt'
      - 'docs/Makefile'
      - 'maxpylang/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=77.0.0" wheel
          # compat mode: the default editable install uses an import hook that type checkers cannot follow
          pip install -e ".[dev]" --config-settings editable_mode=compat
          pip install -r docs/requirements.txt

      # Every example the pages show must run, save a patch with no unknown objects,
      # and pass mypy and pyright; bad_*.py must be flagged on its "# error" lines.
      - name: Check the examples
        run: python docs/run_examples.py --types

      # -W turns warnings into errors: a page that fails to import maxpylang,
      # or a broken link, fails the build instead of publishing an empty page.
      - name: Build documentation (strict)
        run: make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Copy the site into docs/
        if: github.event_name != 'pull_request'
        run: make -C docs deploy

      # docs/app is the MaxPyStudio web app, built separately from web/. The docs build must never touch it.
      - name: Check docs/app is untouched
        run: |
          if [ -n "$(git status --porcelain docs/app)" ]; then
            git status --porcelain docs/app
            echo "::error::The docs build changed docs/app"
            exit 1
          fi

      - name: Commit and push if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          if ! git diff --quiet --staged; then
            git commit -m "Auto-update documentation [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxPy Studio — write patches in the browser</title>
    <style>
      :root {
        --bg: #16181c; --panel: #1d2027; --line: #2c313a;
        --ink: #d6dbe2; --dim: #8b93a0;
        --signal: #e8b73e; --control: #5aa9e6; --video: #a882e6; --go: #4bd08a; --err: #e8736b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
      header {
        padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      }
      h1 { font-size: 14px; margin: 0 10px 0 0; font-weight: 650; }
      .spacer { flex: 1; }
      a.nav { color: var(--dim); font-size: 13px; text-decoration: none; }
      a.nav:hover { color: var(--ink); }
      button {
        background: #262b33; color: var(--ink); border: 1px solid #39404b; border-radius: 6px;
        padding: 6px 11px; font-size: 13px; cursor: pointer;
      }
      button:hover:not(:disabled) { background: #2f3540; border-color: #4a5361; }
      button:disabled { opacity: .4; cursor: default; }
      #run { border-color: var(--control); color: #d6ecfb; }
      #start { border-color: var(--go); color: #cdf6e3; }

      main { flex: 1; display: flex; min-height: 0; }
      .editor-pane { width: 42%; min-width: 320px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
      #editor { flex: 1; min-height: 0; overflow: hidden; background: #14161a; }
      #editor .cm-editor { height: 100%; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
      #editor .cm-editor.cm-focused { outline: none; }
      #editor .cm-scroller { overflow: auto; }
      #console {
        white-space: pre-wrap; padding: 10px 16px; border-top: 1px solid var(--line);
        background: #101216; font: 12px/1.5 ui-monospace, monospace; color: var(--dim);
        max-height: 34%; overflow: auto; min-height: 44px;
      }
      #console.ok { color: #9fe3c1; }
      #console.error { color: var(--err); }
      #graph {
        flex: 1; overflow: auto; padding: 20px;
        background: radial-gradient(circle at 1px 1px, #23272f 1px, transparent 0) 0 0 / 22px 22px;
      }
      .hint { font-size: 11px; color: #6b7280; }

      /* graph nodes + widgets (shared look with the player) */
      .patch-graph { display: block; }
      .patch-graph .node-body { fill: #23272f; stroke: #3a414c; }
      .patch-graph .node:hover .node-body { stroke: #566173; }
      .patch-graph .node-label { fill: var(--ink); font: 11px ui-monospace, Menlo, monospace; dominant-baseline: middle; }
      .patch-graph .node-stub .node-body { fill: #24282f; stroke: #4a3a3a; stroke-dasharray: 4 3; }
      .patch-graph .node-stub .node-label { fill: #8a8f98; }
      .patch-graph .node-caption { fill: var(--dim); font: 10px ui-monospace, monospace; }
      .widget-host { overflow: visible; }
      .max-widget { width: 100%; height: 100%; margin: 0; }
      input[type=range].max-widget { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
      input[type=range].max-widget::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #363d47; }
      input[type=range].max-widget::-moz-range-track { height: 6px; border-radius: 3px; background: #363d47; }
      input[type=range].max-widget::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: var(--control); border: 2px solid #1a1d22; }
      input[type=range].max-widget::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--control); border: 2px solid #1a1d22; }
      input[type=range].max-dial::-webkit-slider-thumb { background: var(--signal); }
      input[type=range].max-dial::-moz-range-thumb { background: var(--signal); }
      input[type=number].max-widget { background: #1a1d22; color: var(--ink); border: 1px solid #39404b; border-radius: 4px; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header>
      <h1>MaxPy Studio</h1>
      <button id="run" disabled>▶ Run (⌘↵)</button>
      <button id="start" disabled>▶ Start audio</button>
      <button id="stop" disabled>■ Stop</button>
      <button id="selftest" disabled>✓ Self-test</button>
      <span class="hint">edit Python → run → press ▶ → drag the widgets</span>
      <span class="spacer"></span>
      <a class="nav" href="./index.html">→ Player</a>
    </header>
    <main>
      <div class="editor-pane">
        <div id="editor"></div>
        <div id="console">Loading the Python runtime… (first load downloads ~15 MB, then it's cached)</div>
      </div>
      <div id="graph"></div>
    </main>
    <script type="module" src="/src/studio.ts"></script>
  </body>
</html>
